# Release pipeline, run when a GitHub release is published:
#   build    → tests, version check, sdist + wheel
#   pypi     → upload with Trusted Publishing (no token stored here)
#   registry → list the new version in the MCP Registry (GitHub OIDC login)
#
# One-time setup on pypi.org: a (pending) trusted publisher for this repository,
# workflow "publish.yml", environment "pypi". The "pypi" environment here only
# accepts v* tags.
name: Publish

on:
  release:
    types: [published]

env:
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]" build
      - name: Release tag matches the package and server.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import gomobsec_mcp; print(gomobsec_mcp.__version__)')"
          srv="$(python -c 'import json; print(json.load(open("server.json"))["version"])')"
          echo "tag=$tag package=$pkg server.json=$srv"
          test "$tag" = "$pkg" && test "$tag" = "$srv"
      - run: pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # The registry checks the package on PyPI; give the new version time to appear.
      - name: Wait for the release on PyPI
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            if curl --fail --silent "https://pypi.org/pypi/gomobsec-mcp/${version}/json" >/dev/null; then
              echo "gomobsec-mcp ${version} is on PyPI"; exit 0
            fi
            sleep 10
          done
          echo "gomobsec-mcp ${version} did not appear on PyPI" >&2; exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Sign in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
